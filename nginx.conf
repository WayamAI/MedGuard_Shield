server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Container liveness. Deliberately not /health — that is the backend's,
    # and confusing the two makes a dead API look like a healthy one.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Fingerprinted assets are immutable: the filename changes when the
    # content does, so they can be cached indefinitely.
    location /static/ {
        # `expires` would emit a second, weaker Cache-Control alongside this
        # one; one explicit header is clearer than two that must agree.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading a
    # stale shell that references asset filenames which no longer exist.
    # An add_header in a location REPLACES the inherited server-level set, so
    # the security headers have to be repeated here rather than assumed.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: client-side routes are not files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Defence in depth; the app sets no inline scripts of its own beyond the
    # anti-FOUC theme snippet in index.html.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
