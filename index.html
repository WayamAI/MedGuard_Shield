<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drishti | Healthcare PHI Risk Intelligence</title>
    <meta name="description" content="Drishti: continuous visibility into where PHI lives, how it moves, who can reach it, and where the risk concentrates." />
    <meta name="author" content="Wayam AI" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("drishti-theme")
            ?? window.localStorage.getItem("medguard-theme");
          const isDark = storedTheme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (error) {
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta property="og:title" content="Drishti by Wayam AI" />
    <meta property="og:description" content="Healthcare PHI Risk Intelligence Platform" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
